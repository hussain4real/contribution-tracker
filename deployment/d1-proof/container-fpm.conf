[global]
daemonize = no
error_log = /run/familyfunds-fpm-error.log

[www]
user = application
group = application
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${FPM_PM_MAX_CHILDREN}
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
request_terminate_timeout = 65s
php_admin_value[error_log] = /var/www/html/storage/logs/php.log
php_admin_flag[log_errors] = on
