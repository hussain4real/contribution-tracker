[program:familyfunds-queue]
command=/usr/local/bin/php /var/www/html/artisan queue:work d1-staging --sleep=3 --tries=3 --timeout=60 --max-time=110
directory=/var/www/html
user=application
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=65
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
