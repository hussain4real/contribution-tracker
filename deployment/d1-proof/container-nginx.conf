user application;
worker_processes auto;
error_log /run/familyfunds-nginx-error.log warn;
pid /run/nginx/nginx.pid;
events { worker_connections 1024; }
http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 512;
    gzip_proxied any;
    upstream php { server 127.0.0.1:9000; }
    server {
        listen 80 default_server;
        root /var/www/html/public;
        index index.php;
        client_max_body_size 16m;
        location = /up {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/deployment/d1-proof/container-health.php;
            fastcgi_pass php;
            fastcgi_read_timeout 2s;
        }
        location / { try_files $uri $uri/ /index.php?$query_string; }
        location = /index.php {
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
            fastcgi_param DOCUMENT_ROOT /var/www/html/public;
            fastcgi_pass php;
            fastcgi_buffer_size 64k;
            fastcgi_buffers 8 16k;
            fastcgi_busy_buffers_size 64k;
            fastcgi_buffering off;
            fastcgi_read_timeout 65s;
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}
