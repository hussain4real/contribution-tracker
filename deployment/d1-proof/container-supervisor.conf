[supervisord]
nodaemon=true
logfile=/run/familyfunds-supervisor.log
logfile_maxbytes=65536
logfile_backups=1
pidfile=/run/supervisord.pid
user=root

[program:php-fpm]
command=/usr/local/sbin/php-fpm --nodaemonize
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/run/familyfunds-php-fpm.log
stdout_logfile_maxbytes=65536
stdout_logfile_backups=1
redirect_stderr=true

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=0
stdout_logfile=/run/familyfunds-nginx.log
stdout_logfile_maxbytes=65536
stdout_logfile_backups=1
redirect_stderr=true

[program:queue]
command=/usr/local/bin/php /var/www/html/artisan queue:work d1-staging --sleep=3 --tries=3 --timeout=60 --max-time=110
directory=/var/www/html
user=application
autostart=true
autorestart=true
startsecs=0
stopwaitsecs=65
stopasgroup=true
killasgroup=true
stdout_logfile=/run/familyfunds-queue.log
stdout_logfile_maxbytes=65536
stdout_logfile_backups=1
redirect_stderr=true
