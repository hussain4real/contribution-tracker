[program:familyfunds-synthetic-scheduler]
command=/bin/sh -c 'if [ "$D1_STAGING_DATABASE" != "familyfunds-d1-web-staging" ]; then exec sleep infinity; fi; while true; do /usr/local/bin/php /var/www/html/deployment/d1-proof/run-staging.php dispatch-synthetic-reports; sleep 60; done'
directory=/var/www/html
user=application
autostart=true
autorestart=true
startsecs=1
stopwaitsecs=5
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
