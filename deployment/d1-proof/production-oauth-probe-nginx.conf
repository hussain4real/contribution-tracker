    # BEGIN FamilyFund one-client OAuth compatibility probe
    location = /mcp/family-fund {
        mirror /__familyfunds_oauth_probe;
        mirror_request_body off;
        fastcgi_pass unix:/var/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root/index.php;
        include /root/familyfunds-oauth-probe/fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }
    location = /__familyfunds_oauth_probe {
        internal;
        proxy_pass http://127.0.0.1:18871/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
        proxy_read_timeout 65s;
        access_log off;
    }
    # END FamilyFund one-client OAuth compatibility probe
