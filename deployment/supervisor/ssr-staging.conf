[program:ssr-staging]
command=php8.4 /var/www/contribution-tracker-staging/artisan inertia:start-ssr
directory=/var/www/contribution-tracker-staging
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deployer
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/ssr-staging.log
stopwaitsecs=30
