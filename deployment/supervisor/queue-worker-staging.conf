[program:queue-worker-staging]
process_name=%(program_name)s
command=php8.4 /var/www/contribution-tracker-staging/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/contribution-tracker-staging
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=deployer
numprocs=1
redirect_stderr=true
stdout_logfile=/var/log/supervisor/queue-worker-staging.log
stopwaitsecs=3600
