[project]
name = "familyfund-payment-risk"
version = "0.1.0"
description = "Offline, leakage-safe payment-risk model training for FamilyFund"
requires-python = ">=3.12,<3.13"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "scikit-learn>=1.7,<1.8",
]

[project.scripts]
payment-risk = "payment_risk.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4,<9",
    "pytest-cov>=6.2,<7",
    "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/payment_risk"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=payment_risk --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
source = ["payment_risk"]

[tool.coverage.report]
fail_under = 100
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["A", "ANN", "ARG", "B", "C4", "E", "F", "I", "N", "PERF", "PL", "RUF", "S", "SIM", "UP", "W"]
ignore = ["ANN401", "PLR0912", "PLR0913", "PLR0915", "PLR2004"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "S101"]
