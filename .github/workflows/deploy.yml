name: Deploy to Production

on:
  push:
    branches:
      - main

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2
          coverage: xdebug

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Node Dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Install PHP Dependencies
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Copy Environment File
        run: cp .env.example .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Generate Wayfinder Routes
        run: php artisan wayfinder:generate

      - name: Build Assets
        run: npm run build

      - name: Run Tests
        run: composer test:coverage -- --ci

  deploy:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: deployer
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /var/www/contribution-tracker

            # Pull latest changes
            git config --global --add safe.directory /var/www/contribution-tracker

            if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
              echo "Production checkout has local tracked changes. Refusing to deploy over them."
              git status --short
              exit 1
            fi

            git fetch origin main
            DEPLOY_SHA='${{ github.sha }}'
            if [ "$(git rev-parse origin/main)" != "$DEPLOY_SHA" ]; then
              echo "Production branch advanced beyond the tested commit. Refusing deployment."
              exit 1
            fi
            git merge-base --is-ancestor HEAD "$DEPLOY_SHA"

            # Verify existing noninteractive status access before taking production offline.
            # Status access does not prove authorization to stop these consumers.
            for consumer in 'queue-worker:*' ssr nightwatch; do
              timeout 30 sudo -n supervisorctl status "$consumer" | awk 'NF { count++; if ($2 != "RUNNING") failed = 1 } END { exit (failed || !count) }'
            done

            # Keep failed upgrades offline; never roll back a migrated database automatically.
            maintenance_active() {
              # Laravel supports both file and cache maintenance drivers. Only an
              # explicit response confirms state; errors, timeouts and early exits do not.
              local maintenance_state
              if ! maintenance_state="$(timeout 30 php -r 'try { require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap(); echo $app->isDownForMaintenance() ? "active" : "inactive"; } catch (Throwable $exception) { exit(2); }' 2>/dev/null)"; then
                return 2
              fi
              case "$maintenance_state" in
                active) return 0 ;;
                inactive) return 1 ;;
                *) return 2 ;;
              esac
            }
            MAINTENANCE_ATTEMPTED=false
            QUIESCED=false
            deployment_failed() {
              result=$?
              trap - EXIT INT TERM
              if [ "$MAINTENANCE_ATTEMPTED" = true ]; then
                php artisan down --render='errors::503' --retry=60 >/dev/null 2>&1 || true
                if [ "$QUIESCED" = true ] || maintenance_active; then
                  timeout 300 sudo -n supervisorctl stop 'queue-worker:*' >/dev/null 2>&1 || true
                  timeout 300 sudo -n supervisorctl stop ssr >/dev/null 2>&1 || true
                  timeout 300 sudo -n supervisorctl stop nightwatch >/dev/null 2>&1 || true
                  echo "Deployment failed after confirmed maintenance; consumer stop cleanup attempted. Verify state before restoring traffic."
                else
                  echo "Maintenance could not be confirmed; consumer state left unchanged. Deployment aborted."
                fi
              fi
              exit "$result"
            }
            trap deployment_failed EXIT
            trap 'exit 130' INT
            trap 'exit 143' TERM

            MAINTENANCE_ATTEMPTED=true
            php artisan down --render='errors::503' --retry=60
            if ! maintenance_active; then
              echo "Maintenance is inactive or could not be verified. Refusing deployment."
              exit 1
            fi
            # Retain this boundary if replaced code or dependencies break later probes.
            QUIESCED=true
            timeout 300 sudo -n supervisorctl stop 'queue-worker:*'
            timeout 300 sudo -n supervisorctl stop ssr
            timeout 300 sudo -n supervisorctl stop nightwatch

            drain_http_workers() {
              maintenance_active
              # The existing graceful reload lets old HTTP requests finish. New workers
              # serve the pre-rendered maintenance response while dependencies change.
              FPM_MASTER_PID="$(systemctl show php8.4-fpm --property=MainPID --value)"
              if ! [[ "$FPM_MASTER_PID" =~ ^[1-9][0-9]*$ ]]; then
                echo "Unable to identify the PHP-FPM master. Refusing deployment."
                exit 1
              fi
              OLD_FPM_CHILDREN="$(pgrep -P "$FPM_MASTER_PID")"
              if [ -z "$OLD_FPM_CHILDREN" ]; then
                echo "Unable to identify existing PHP-FPM workers. Refusing deployment."
                exit 1
              fi
              OLD_FPM_STARTS=()
              for worker_pid in $OLD_FPM_CHILDREN; do
                OLD_FPM_STARTS[$worker_pid]="$(awk '{print $22}' "/proc/$worker_pid/stat")"
              done
              drain_deadline=$((SECONDS + 300))
              timeout 300 sudo -n systemctl reload php8.4-fpm
              while true; do
                old_workers_remaining=false
                for worker_pid in $OLD_FPM_CHILDREN; do
                  current_start=''
                  if [ -e "/proc/$worker_pid/stat" ]; then
                    current_start="$(awk '{print $22}' "/proc/$worker_pid/stat")"
                    test -n "$current_start"
                  fi
                  if [ -n "$current_start" ] && [ "$current_start" = "${OLD_FPM_STARTS[$worker_pid]}" ]; then
                    old_workers_remaining=true
                  fi
                done
                if [ "$old_workers_remaining" = false ]; then
                  break
                fi
                if [ "$SECONDS" -ge "$drain_deadline" ]; then
                  echo "Old PHP-FPM requests did not drain. Refusing deployment."
                  exit 1
                fi
                sleep 1
              done
              systemctl is-active --quiet php8.4-fpm

            }
            drain_http_workers

            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"
            echo "Deploying $(git rev-parse --short HEAD)"

            # Install PHP dependencies
            composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

            # Install Node dependencies and build assets
            npm ci
            php artisan optimize:clear
            rm -rf resources/js/actions resources/js/routes resources/js/wayfinder
            php artisan wayfinder:generate
            npm run build

            # Run database migrations
            php artisan migrate --force

            # Keep storage readable by the scheduled backup process and PHP-FPM
            bash deployment/ensure-storage-permissions.sh /var/www/contribution-tracker

            # Clear and rebuild caches
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan event:cache

            # Update Nginx cache headers for PWA service workers and manifest
            NGINX_SITE_CONFIG=""

            if [ -f /etc/nginx/sites-available/familyfunds.app.conf ]; then
              NGINX_SITE_CONFIG="/etc/nginx/sites-available/familyfunds.app.conf"
            elif [ -f /etc/nginx/sites-available/familyfunds.app ]; then
              NGINX_SITE_CONFIG="/etc/nginx/sites-available/familyfunds.app"
            fi

            if [ -n "$NGINX_SITE_CONFIG" ]; then
              sudo cp deployment/nginx/familyfunds.app.conf "$NGINX_SITE_CONFIG"
              sudo nginx -t
              sudo systemctl reload nginx
            fi

            # Restart queue workers, SSR server, and Nightwatch agent
            sudo supervisorctl restart queue-worker:*
            sudo supervisorctl restart ssr
            sudo supervisorctl restart nightwatch

            timeout 30 sudo -n supervisorctl status 'queue-worker:*' | awk 'NF { count++; if ($2 != "RUNNING") failed = 1 } END { exit (failed || !count) }'
            timeout 30 sudo -n supervisorctl status ssr | awk 'NF { count++; if ($2 != "RUNNING") failed = 1 } END { exit (failed || !count) }'
            timeout 30 sudo -n supervisorctl status nightwatch | awk 'NF { count++; if ($2 != "RUNNING") failed = 1 } END { exit (failed || !count) }'

            # Reload PHP-FPM gracefully
            drain_http_workers

            php artisan up
            curl --fail --silent --show-error https://familyfunds.app/up >/dev/null
            QUIESCED=false
            trap - EXIT INT TERM

            echo "Deployment complete!"
